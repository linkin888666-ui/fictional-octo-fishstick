<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070e21"><title>BRUCE 台股 AI 雷達</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;color:#e9f8ff;background:radial-gradient(ellipse at 20% 0%,#193c78 0%,transparent 42%),radial-gradient(ellipse at 100% 40%,#391e64 0%,transparent 35%),#070e21;min-height:100vh}.app{max-width:620px;margin:auto;padding:24px 15px 95px}.top{display:flex;justify-content:space-between;align-items:center}h1{font-size:25px;margin:8px 0 2px;color:#bdefff;text-shadow:0 0 18px #00aeff}small,.muted{color:#8aa5bf}header{padding:15px;border:1px solid #2689db;border-radius:18px;background:#0b1c38cc;box-shadow:0 0 22px #006bd044;margin:20px 0}.radar{width:94px;height:94px;border:5px solid #25ddff;border-left-color:#a34fff;border-radius:50%;display:grid;place-content:center;box-shadow:0 0 24px #00c8ff66;animation:spin 9s linear infinite}.radar strong{font-size:23px}.radar span{font-size:11px;text-align:center}@keyframes spin{to{filter:hue-rotate(360deg)}}.summary{display:flex;align-items:center;justify-content:space-around;gap:10px}.metric{text-align:center}.metric strong{font-size:24px;display:block}.metric span{font-size:11px;color:#9fbed8}.pill{border:1px solid #7d55ff;background:#24144e;border-radius:18px;padding:5px 10px;font-size:12px;color:#d6bdff}.heading{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px}button{font:inherit;color:#dff9ff;background:#11294b;border:1px solid #2689db;border-radius:10px;padding:9px 12px;cursor:pointer}button:active{transform:scale(.98)}.cards{display:grid;gap:12px}.card{padding:16px;border:1px solid #2d78d5;border-radius:16px;background:linear-gradient(110deg,#11294cdd,#11162edd);box-shadow:inset 0 0 15px #0a83d41a,0 0 12px #0464a630}.card-top{display:flex;justify-content:space-between}.name{font-size:20px;font-weight:700}.price{font-size:22px;font-weight:700;text-align:right}.positive{color:#ff667e}.negative{color:#44e6ad}.tag{display:inline-block;font-size:12px;padding:4px 8px;border:1px solid #5e79c9;border-radius:7px;color:#9be6ff;margin:6px 4px 0 0}.detail{margin-top:12px;border-top:1px solid #335077;padding-top:12px;font-size:13px;line-height:2;color:#b8d5ed}.error{color:#ffbd7b}.loading{color:#8bdfff}.footer{position:fixed;bottom:0;left:0;right:0;background:#09172de8;border-top:1px solid #2784cc;backdrop-filter:blur(16px);display:flex;justify-content:space-around;padding:15px 0 max(15px,env(safe-area-inset-bottom));font-size:12px}.footer span{color:#73dfff}#status{font-size:12px;color:#a5c5df;margin:10px 0}select{background:#132d50;color:white;border:1px solid #2784cc;border-radius:10px;padding:9px}a{color:#69d8ff}
</style></head><body><main class="app"><div class="top"><div><small>SMART STOCK RADAR</small><h1>台股 AI 雷達</h1></div><span class="pill">盤後日線版</span></div><header><div class="summary"><div class="radar"><strong id="avg">--</strong><span>平均評分</span></div><div class="metric"><strong id="valid">--</strong><span>已分析檔數</span></div><div class="metric"><strong>5/20</strong><span>MA 趨勢</span></div></div></header><div class="heading"><div><strong>個股技術掃描</strong><div class="muted" style="font-size:12px">資料來源：TWSE 官方盤後行情</div></div><button onclick="load()">↻ 更新</button></div><div id="status">尚未讀取資料</div><div class="cards" id="cards"></div><p class="muted" style="font-size:12px;line-height:1.7">本系統為技術觀察工具，非投資建議。評分不是上漲機率。免費雲端主機可能休眠，首次讀取較慢。無法取得資料時不顯示虛構價格。</p></main><nav class="footer"><span>⌂ 首頁</span><span>◎ 雷達</span><span>▥ 指標</span><span>⚙ 設定</span></nav><script>
const stocks=['1802','1815','1303','2330','2317','2409','3481'];let results={};
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){document.querySelector('#cards').innerHTML=stocks.map(code=>{let d=results[code];if(!d)return '<div class="card loading">'+code+' 讀取中…</div>';if(d.error)return '<div class="card"><div class="name">'+code+'</div><div class="error">'+safe(d.error)+'</div></div>';return '<article class="card"><div class="card-top"><div><div class="name">'+safe(d.name)+'</div><small>'+code+' · '+safe(d.date)+'</small></div><div><div class="price">'+d.close+'</div><div class="'+(d.change>=0?'positive':'negative')+'">'+(d.change>0?'+':'')+d.change+'%</div></div></div><div>'+d.tags.map(t=>'<span class="tag">'+safe(t)+'</span>').join('')+'</div><div class="detail">綜合評分 '+d.score+'/100　｜　量比 '+d.volume_ratio+'<br>5MA '+d.ma5+'　20MA '+d.ma20+'<br>RSI(5) '+d.rsi5+'　RSI(10) '+d.rsi10+'<br>DIF '+d.dif+'　MACD柱 '+d.macd_hist+'</div></article>'}).join('');let ok=Object.values(results).filter(x=>x&&!x.error);document.querySelector('#avg').textContent=ok.length?Math.round(ok.reduce((a,b)=>a+b.score,0)/ok.length):'--';document.querySelector('#valid').textContent=ok.length+'/'+stocks.length}
async function load(){results={};render();document.querySelector('#status').textContent='正在取得官方歷史資料…';await Promise.all(stocks.map(async code=>{try{let r=await fetch('/api/stocks?code='+code);results[code]=await r.json()}catch(e){results[code]={error:'連線失敗：'+e.message}}render()}));document.querySelector('#status').textContent='更新完成 · 以各股票卡片顯示的交易日為準'}load();
</script></body></html>
