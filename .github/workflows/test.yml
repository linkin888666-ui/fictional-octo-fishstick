name: Regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m unittest -v
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: python scripts/with_server.py --server "python server.py" --port 8765 -- python scripts/smoke.py
